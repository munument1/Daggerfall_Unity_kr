name: Format and validate Korean NameGen

on:
  push:
    branches:
      - agent/namegen-full-korean

permissions:
  contents: write

jobs:
  format-namegen:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/namegen-full-korean
          fetch-depth: 0

      - name: Validate and format NameGen
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          path = Path('text/NameGen.txt')
          data = json.loads(path.read_text(encoding='utf-8'))
          expected = ['Breton', 'Redguard', 'Nord', 'DarkElf', 'HighElf', 'WoodElf', 'Khajiit', 'Imperial', 'Monster1', 'Monster2', 'Monster3']
          if list(data) != expected:
              raise SystemExit(f'Unexpected bank order: {list(data)}')

          count = 0
          for bank_name, bank in data.items():
              if bank['setCount'] != len(bank['sets']):
                  raise SystemExit(f'Set count mismatch in {bank_name}')
              for index, name_set in enumerate(bank['sets']):
                  if name_set['setIndex'] != index:
                      raise SystemExit(f'Set index mismatch in {bank_name}: {index}')
                  for part in name_set['parts']:
                      count += 1
                      if re.search(r'[A-Za-z]', part):
                          raise SystemExit(f'Latin letters remain in {bank_name}: {part}')
                      if re.search(r"[^가-힣'\- ]", part):
                          raise SystemExit(f'Unexpected character in {bank_name}: {part}')

          if count != 785:
              raise SystemExit(f'Expected 785 name parts, found {count}')

          path.write_text(json.dumps(data, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')
          PY
          rm .github/workflows/namegen-format.yml

      - name: Commit formatted data
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add text/NameGen.txt .github/workflows/namegen-format.yml
          git commit -m '한글 이름 생성 데이터 형식 정리'
          git push origin HEAD:agent/namegen-full-korean
