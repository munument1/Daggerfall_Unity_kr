name: Export official quests (temporary)

on:
  push:
    branches:
      - agent/linebreak-review-sheet

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout official Daggerfall Unity source
        uses: actions/checkout@v4
        with:
          repository: Interkarma/daggerfall-unity
          ref: 81e89e90c27bc3c1a7a61871e545fad129174dec
          path: official
          sparse-checkout: |
            Assets/StreamingAssets/Quests
          sparse-checkout-cone-mode: false

      - name: Upload official quest sources
        uses: actions/upload-artifact@v4
        with:
          name: dfu-official-quests-v1.1.1
          path: official/Assets/StreamingAssets/Quests
          if-no-files-found: error
          retention-days: 1
