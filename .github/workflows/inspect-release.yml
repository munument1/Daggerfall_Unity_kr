name: Inspect release conventions

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  inspect:
    if: github.head_ref == 'agent/release-inspect-20260803'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout inspection branch
        uses: actions/checkout@v4
        with:
          ref: agent/release-inspect-20260803
          fetch-depth: 0

      - name: Inspect releases, tags, and package folders
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/release-inspect
          mkdir -p /tmp/release-inspect
          gh release download v1.1.1-ko-r2 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'Daggerfall_Unity_kr_v1.1.1-ko-r2.zip' \
            --dir /tmp/release-inspect
          {
            echo '=== repository ==='
            echo "main_sha=$(git rev-parse origin/main)"
            echo
            echo '=== releases ==='
            gh release list --repo "$GITHUB_REPOSITORY" --limit 30 || true
            echo
            echo '=== latest release ==='
            gh release view v1.1.1-ko-r2 --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,isPrerelease,publishedAt,body,assets
            echo
            echo '=== tags ==='
            git tag --sort=-creatordate | head -30
            echo
            echo '=== current package folders ==='
            for d in BIOGs fonts movies text textures 0; do
              if [ -d "$d" ]; then
                printf '%s\tfiles=%s\tbytes=%s\n' "$d" "$(find "$d" -type f | wc -l)" "$(du -sb "$d" | cut -f1)"
              else
                echo "$d MISSING"
              fi
            done
            echo
            echo '=== r2 zip listing ==='
            unzip -l /tmp/release-inspect/Daggerfall_Unity_kr_v1.1.1-ko-r2.zip
          } > tools/_temp_release_report.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/_temp_release_report.txt
          if ! git diff --cached --quiet; then
            git commit -m '임시 기존 배포 ZIP 구조 조사'
            git push origin HEAD:agent/release-inspect-20260803
          fi
