name: Apply completed line-break review

on:
  push:
    branches:
      - agent/apply-linebreak-review-20260803
    paths:
      - .github/workflows/apply-linebreak-review.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install workbook reader
        run: python -m pip install --disable-pip-version-check openpyxl

      - name: Download completed review workbook
        run: |
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://docs.google.com/spreadsheets/d/1Dfr8wvMRvkU2HlpYj9RNf0oc44WtxIGDhllF2JaQbz0/export?format=xlsx' \
            -o /tmp/review.xlsx
          test -s /tmp/review.xlsx

      - name: Restore control markers and validate review
        run: |
          cat > /tmp/apply_reviews.py <<'PY'
          from __future__ import annotations
          import hashlib, json, re, sys
          from collections import Counter
          from dataclasses import dataclass
          from pathlib import Path
          from openpyxl import load_workbook

          HEADER_RE = re.compile(
              r"^(QuestorOffer|RefuseQuest|AcceptQuest|QuestFail|QuestComplete|"
              r"RumorsDuringQuest|RumorsPostfailure|RumorsPostsuccess|"
              r"QuestorPostsuccess|QuestorPostfailure|QuestLogEntry|QuestTimeLapse|Message):"
              r"\s*(?:\[(\d+)\]|(\d+))?\s*$"
          )
          TOKEN_RE = re.compile(r"(?:==?[A-Za-z0-9.$]+_|_{1,4}[A-Za-z0-9.$]+_|%[A-Za-z0-9]+(?:-self)?)")
          STRUCTURAL_RE = re.compile(r"<--->|%qdt|%qdat")
          SYMBOLS_MARKER = "-- Symbols used in the QRC file:"
          EDITORIAL_NOTE_RE = re.compile(r"^-\s*(?:moved|corrected|lowered|changed)\b", re.IGNORECASE)
          COUNT_LINE_RE = re.compile(r"^(--\s*)(\S+?)(\s+occurs\s+)(\d+)(\s+times?\.)$")
          CENTER_SEPARATOR_LABEL = "──── 선택지 구분 ────"
          APPROVED = {"완료", "승인", "approved", "done"}
          SHEETS = ["가운데 정렬", "퀘스트 일지", "일반 메시지"]
          BUILTIN_PERCENT = {
              "%pcn","%pcf","%pct","%ra","%reg","%rn","%rt","%god","%oth","%qdt","%qdat","%vam","%t",
              "%g","%g1","%g2","%g2-self","%g2self","%g3","%g3-self","%g3self","%g4",
              "%G","%G1","%G2","%G2-self","%G2self","%G3","%G3-self","%G3self","%G4",
          }
          CSV_COLUMNS = [
              "record_id", "category", "source_file", "quest_id", "key", "header",
              "english", "current_korean", "reviewed_korean", "status", "notes",
              "source_hash", "content_signature", "token_sequence",
              "structural_sequence", "current_lines", "current_max_width",
          ]

          @dataclass(frozen=True)
          class Block:
              key: str
              header: str
              body: str
              trailer: str = ""

          def read_text(path: Path) -> str:
              return path.read_text(encoding="utf-8").replace("\r\n", "\n").replace("\r", "\n")

          def sha256_text(text: str) -> str:
              return hashlib.sha256(text.encode("utf-8")).hexdigest()

          def split_sections(text: str):
              if "QRC:" not in text or "QBN:" not in text:
                  raise ValueError("missing QRC: or QBN: section")
              pre, rest = text.split("QRC:", 1)
              qrc, qbn = rest.split("QBN:", 1)
              return pre + "QRC:\n", qrc.strip("\n"), "QBN:" + qbn

          def split_qrc_suffix(qrc: str):
              marker = qrc.find(SYMBOLS_MARKER)
              if marker < 0:
                  return qrc.rstrip("\n"), ""
              suffix_start = marker
              while suffix_start > 0 and qrc[suffix_start - 1] == "\n":
                  suffix_start -= 1
              return qrc[:suffix_start].rstrip("\n"), qrc[suffix_start:]

          def parse_blocks(qrc: str):
              lines = qrc.splitlines()
              starts = [i for i, line in enumerate(lines) if HEADER_RE.match(line)]
              blocks = []
              for index, start in enumerate(starts):
                  end = starts[index + 1] if index + 1 < len(starts) else len(lines)
                  header = lines[start]
                  match = HEADER_RE.match(header); assert match
                  number = match.group(2) or match.group(3) or str(index)
                  key = f"{match.group(1)}:{number}"
                  body_lines = lines[start + 1:end]
                  pos = len(body_lines) - 1
                  while pos >= 0 and not body_lines[pos].strip(): pos -= 1
                  comment_end = pos
                  while pos >= 0 and (body_lines[pos].lstrip().startswith("--") or EDITORIAL_NOTE_RE.match(body_lines[pos].strip())):
                      pos -= 1
                  if pos < comment_end:
                      while pos >= 0 and not body_lines[pos].strip(): pos -= 1
                      trailer_start = pos + 1
                      trailer_lines = body_lines[trailer_start:]
                      body_lines = body_lines[:trailer_start]
                  else:
                      trailer_lines = []
                  while body_lines and not body_lines[-1].strip(): body_lines.pop()
                  trailer = ("\n" + "\n".join(trailer_lines)) if trailer_lines else ""
                  blocks.append(Block(key, header, "\n".join(body_lines), trailer))
              return blocks

          def is_centered_panel(body: str) -> bool:
              visible = [raw.strip() for raw in body.splitlines() if raw.strip() and raw.strip() != "<--->"]
              return bool(visible) and all(line.startswith("<ce>") for line in visible)

          def classify(block: Block) -> str:
              if block.key.startswith("QuestLogEntry:") or "%qdt" in block.body or "%qdat" in block.body:
                  return "퀘스트 일지"
              return "가운데 정렬 패널" if is_centered_panel(block.body) else "일반 메시지"

          def normalize_general_review(text: str) -> str:
              lines=[]
              for raw in text.replace("\\n","\n").replace("\r\n","\n").replace("\r","\n").splitlines():
                  line=raw.rstrip()
                  if line.strip() == CENTER_SEPARATOR_LABEL:
                      lines.append("<--->")
                  else:
                      lines.append(line)
              while lines and not lines[-1].strip(): lines.pop()
              return "\n".join(lines)

          def normalize_center_review(text: str) -> str:
              lines=[]
              for raw in text.replace("\\n","\n").replace("\r\n","\n").replace("\r","\n").splitlines():
                  line=raw.strip()
                  if not line: continue
                  if line in {CENTER_SEPARATOR_LABEL, "<--->"}:
                      lines.append("<--->"); continue
                  if line.startswith("<ce>"): line=line[4:].lstrip()
                  if line: lines.append("<ce>"+line)
              return "\n".join(lines)

          def normalized_review(row: dict[str,str], block: Block) -> str:
              text=row["reviewed_korean"] or ""
              return normalize_center_review(text) if classify(block)=="가운데 정렬 패널" else normalize_general_review(text)

          def centered_line_errors(body: str):
              errors=[]
              for n,raw in enumerate(body.splitlines(),1):
                  line=raw.strip()
                  if not line or line=="<--->": continue
                  if not line.startswith("<ce>"): errors.append(f"centered line {n} missing <ce>")
              return errors

          def token_base(token: str) -> str:
              if token.startswith("%"): return token
              return token.lstrip("=_").rstrip("_")

          def refresh_symbol_counts(suffix: str, message_qrc: str) -> str:
              if not suffix: return suffix
              counts=Counter(TOKEN_RE.findall(message_qrc))
              out=[]
              for line in suffix.splitlines():
                  m=COUNT_LINE_RE.match(line)
                  if not m:
                      out.append(line); continue
                  prefix,token,middle,oldnum,tail=m.groups()
                  n=counts.get(token,0)
                  word=" time." if n==1 else " times."
                  out.append(f"{prefix}{token}{middle}{n}{word}")
              return "\n".join(out)

          def load_rows(xlsx: Path):
              wb=load_workbook(xlsx,read_only=True,data_only=False)
              allrows=[]; seen=set(); counts={}
              for sheet in SHEETS:
                  ws=wb[sheet]
                  it=ws.iter_rows(values_only=True)
                  headers=["" if x is None else str(x) for x in next(it)]
                  idx={h:i for i,h in enumerate(headers)}
                  missing=[h for h in CSV_COLUMNS if h not in idx]
                  if missing: raise ValueError(f"{sheet}: missing columns {missing}")
                  count=0
                  for vals in it:
                      if not vals or not any(v is not None for v in vals): continue
                      row={h:("" if vals[idx[h]] is None else str(vals[idx[h]])) for h in CSV_COLUMNS}
                      if not row["record_id"]: continue
                      if row["record_id"] in seen: raise ValueError(f"duplicate record_id {row['record_id']}")
                      seen.add(row["record_id"]); allrows.append(row); count+=1
                  counts[sheet]=count
              return allrows,counts

          def apply(root: Path):
              xlsx=Path('/tmp/review.xlsx'); kor=root/'text'/'Quests'
              rows,tab_counts=load_rows(xlsx)
              status=Counter(r['status'].strip() for r in rows)
              grouped={}
              for r in rows: grouped.setdefault(r['quest_id'],{})[r['key']]=r
              errors=[]; warnings=[]; report=[]; changed_rows=0; approved_rows=0
              token_changed_rows=0; content_changed_rows=0; files_changed=0
              for qid,qrows in sorted(grouped.items()):
                  src=kor/f'{qid}-LOC.txt'
                  if not src.is_file(): errors.append(f'{qid}: missing Korean source'); continue
                  original=read_text(src)
                  pre,qrc,qbn=split_sections(original); message_qrc,suffix=split_qrc_suffix(qrc)
                  blocks=parse_blocks(message_qrc)
                  blockmap={b.key:b for b in blocks}
                  allowed_named={token_base(t) for t in TOKEN_RE.findall(original) if not t.startswith('%')}
                  allowed_percent={t for t in TOKEN_RE.findall(original) if t.startswith('%')} | BUILTIN_PERCENT
                  rendered=[]; file_changed_rows=0
                  for block in blocks:
                      body=block.body; row=qrows.get(block.key)
                      if row and row['status'].strip().casefold() in APPROVED:
                          approved_rows+=1
                          if row['source_hash'] != sha256_text(block.body):
                              errors.append(f'{qid} {block.key}: source hash mismatch')
                          reviewed=normalized_review(row,block)
                          if not reviewed and block.body:
                              errors.append(f'{qid} {block.key}: non-empty source was cleared')
                          if classify(block)=='가운데 정렬 패널':
                              errors.extend(f'{qid} {block.key}: {e}' for e in centered_line_errors(reviewed))
                          if CENTER_SEPARATOR_LABEL in reviewed:
                              errors.append(f'{qid} {block.key}: human separator label remains')
                          expected_struct=json.loads(row['structural_sequence'] or '[]')
                          actual_struct=STRUCTURAL_RE.findall(reviewed)
                          if expected_struct != actual_struct:
                              errors.append(f'{qid} {block.key}: structural sequence changed {expected_struct} -> {actual_struct}')
                          for tok in TOKEN_RE.findall(reviewed):
                              if tok.startswith('%'):
                                  if tok not in allowed_percent:
                                      errors.append(f'{qid} {block.key}: unknown percent token {tok}')
                              elif token_base(tok) not in allowed_named:
                                  errors.append(f'{qid} {block.key}: unknown named token {tok}')
                          original_tokens=json.loads(row['token_sequence'] or '[]')
                          reviewed_tokens=TOKEN_RE.findall(reviewed)
                          if original_tokens != reviewed_tokens: token_changed_rows += 1
                          if re.sub(r'\s+','',reviewed.replace('<ce>','')) != re.sub(r'\s+','',block.body.replace('<ce>','')):
                              content_changed_rows += 1
                          if reviewed != block.body:
                              body=reviewed; file_changed_rows+=1; changed_rows+=1
                      rendered.append(block.header+'\n'+body+block.trailer)
                  missing=set(qrows)-set(blockmap)
                  for key in sorted(missing):
                      if qrows[key]['status'].strip().casefold() in APPROVED:
                          errors.append(f'{qid} {key}: block missing')
                  new_message='\n\n'.join(rendered)
                  new_suffix=refresh_symbol_counts(suffix,new_message)
                  new_text=pre+new_message+new_suffix+'\n\n'+qbn
                  _,check_qrc,check_qbn=split_sections(new_text)
                  check_msg,_=split_qrc_suffix(check_qrc)
                  check_blocks=parse_blocks(check_msg)
                  if [b.key for b in check_blocks] != [b.key for b in blocks]:
                      errors.append(f'{qid}: header/key sequence changed')
                  if check_qbn != qbn:
                      errors.append(f'{qid}: QBN changed unexpectedly')
                  if file_changed_rows:
                      src.write_text(new_text,encoding='utf-8',newline='\n')
                      files_changed+=1
                      report.append({'quest_id':qid,'changed_rows':file_changed_rows,'path':f'text/Quests/{src.name}'})
              if len(rows)!=3816: errors.append(f'row count {len(rows)} != 3816')
              if status != Counter({'완료':3816}): errors.append(f'status distribution unexpected: {dict(status)}')
              result={
                'tabs':tab_counts,'status':dict(status),'approved_rows':approved_rows,
                'changed_rows':changed_rows,'content_changed_rows':content_changed_rows,
                'token_changed_rows':token_changed_rows,'changed_files':files_changed,'files':report,
                'errors':errors,'warnings':warnings,
              }
              Path('/tmp/final_apply_report.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              print(json.dumps({k:v for k,v in result.items() if k!='files'},ensure_ascii=False,indent=2))
              if errors:
                  for e in errors[:200]: print(e,file=sys.stderr)
                  print(f'ERRORS={len(errors)}',file=sys.stderr); raise SystemExit(1)

          if __name__=='__main__': apply(Path.cwd())
          PY
          python /tmp/apply_reviews.py
          git diff --check

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: linebreak-apply-report
          path: /tmp/final_apply_report.json

      - name: Commit reviewed quest files
        run: |
          if git diff --quiet -- text/Quests; then
            echo 'No quest file changes were produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add text/Quests
          git commit -m '공동검수 완료본 반영'
          git push origin HEAD:agent/apply-linebreak-review-20260803
