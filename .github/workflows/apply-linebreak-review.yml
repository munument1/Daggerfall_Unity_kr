name: Apply completed line-break review

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/apply-linebreak-review-20260803

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install workbook reader
        run: python -m pip install --disable-pip-version-check openpyxl

      - name: Download completed review workbook
        run: |
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://docs.google.com/spreadsheets/d/1Dfr8wvMRvkU2HlpYj9RNf0oc44WtxIGDhllF2JaQbz0/export?format=xlsx' \
            -o /tmp/review.xlsx
          test -s /tmp/review.xlsx

      - name: Restore control markers and validate review
        run: |
          python tools/_temp_apply_completed_review.py
          git diff --check

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: linebreak-apply-report
          path: /tmp/final_apply_report.json

      - name: Commit reviewed quest files
        run: |
          if git diff --quiet -- text/Quests; then
            echo 'No quest file changes were produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add text/Quests
          git commit -m '공동검수 완료본 반영'
          git push origin HEAD:agent/apply-linebreak-review-20260803
